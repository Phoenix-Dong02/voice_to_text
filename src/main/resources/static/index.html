<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice to Text</title>
</head>
<body>

	<button id = "recordBtn">start</button>

	<p id = "status">wait</p>

	<div id = "result"></div>

    <script>
		const recordBtn = document.getElementById("recordBtn");
		const status = document.getElementById("status");
		const result = document.getElementById("result");

		
		let mediaRecorder
		let audioChunks
		let stream
		
		function addDataChunk(e){
			audioChunks.push(e.data);
		}
		
		async function finalizeRecording(){
			const finalRecording = new Blob(audioChunks, {type: "audio/webm"});
			console.log(finalRecording);
			console.log("stream is:", stream);
			// stream and mediaRecorder are two different things
			// stop mediaRecorder but stream is still active
			stream.getTracks().forEach(track => track.stop());
			// adding await makes sure finalizeRecording finishes after uploading Recording
			await uploadRecording(finalRecording);
			}
			
			
		async function uploadRecording(blob) {
			  
			  const formData = new FormData();
			  formData.append("audio", blob, "recording.webm");
			  

			  try {
			    
				const response = await fetch("/api/v1/transcribe",{
					method: "POST",
					// here, i don't need to write header and boundary
					// because the browser will add these things autimatically when it detects formData type
					body: formData
				});

			    // parsing the response body takes some time
				// need to add await
				const json = await response.json();

				result.textContent = json["text"];

			  } catch (error) {
			    console.error("an error happens in uploading or rewriting:", error);
			  }
			}

		async function startRecording() {
		    try {
		        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

				mediaRecorder = new MediaRecorder(stream, {mimeType: "audio/webm"});
				audioChunks = [];

				mediaRecorder.addEventListener("dataavailable", addDataChunk);				
				mediaRecorder.addEventListener("stop", finalizeRecording);
				// dataavailable event happens every second and then push datachunk into datachunks each time
				// instead of geeting a big blob when stopped
				mediaRecorder.start(1000); 
				

		        status.textContent = "recording";
		        recordBtn.textContent = "end";
		        console.log("recording started");
		    } catch (error) {
		        console.error("fail to get the permission of audio:", error);
		    }
		}

		function stopRecording() {
			mediaRecorder.stop();
		    status.textContent = "stopped";
		    recordBtn.textContent = "start";
		    console.log("recording stopped");
		}

		recordBtn.addEventListener("click", () => {
		    if (recordBtn.textContent === "start"){
				startRecording();
			} else{
				stopRecording();
			}
			
		});
    </script>

</body>
</html>
