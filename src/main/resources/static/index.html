<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice to Text</title>
</head>
<body>

	<button id = "recordBtn">start</button>

	<p id = "status">wait</p>

	<div id = "result"></div>

    <script>
		const recordBtn = document.getElementById("recordBtn");
		const status = document.getElementById("status");
		const result = document.getElementById("result");

		
		let mediaRecorder
		let audioChunks
		let stream
		
		function addDataChunk(e){
			audioChunks.push(e.data);
		}
		
		function finalizeRecording(){
			const finalRecording = new Blob(audioChunks, {type: "audio/webm"});
			console.log(finalRecording);
			console.log("stream is:", stream);
			stream.getTracks().forEach(track => track.stop());
			}

		async function startRecording() {
		    try {
		        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

				mediaRecorder = new MediaRecorder(stream, {mimeType: "audio/webm"});
				audioChunks = [];

				mediaRecorder.addEventListener("dataavailable", addDataChunk);				
				mediaRecorder.addEventListener("stop", finalizeRecording);
				mediaRecorder.start(1000);
				

		        status.textContent = "recording";
		        recordBtn.textContent = "end";
		        console.log("recording started");
		    } catch (error) {
		        console.error("fail to get the permission of audio:", error);
		    }
		}

		function stopRecording() {
			mediaRecorder.stop();
		    status.textContent = "stopped";
		    recordBtn.textContent = "start";
		    console.log("recording stopped");
		}

		recordBtn.addEventListener("click", () => {
		    if (recordBtn.textContent === "start"){
				startRecording();
			} else{
				stopRecording();
			}
			
		});
    </script>

</body>
</html>
